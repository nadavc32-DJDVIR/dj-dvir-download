# Keeps the free Render hub awake: pings it every ~10 min so it doesn't spin down after 15 min idle.
# Free (GitHub-hosted runner, a few seconds per run). Occasional cron delays only add safety margin to
# Render's 750 free instance-hours/month, so it never runs out mid-month.
name: keep-hub-awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: ping hub
        run: curl -sS -m 45 -o /dev/null -w "hub %{http_code}\n" https://dj-dvir-hub.onrender.com/api/download || true
